name: Auto Video Processing Pipeline

on:
  workflow_dispatch:
    inputs:
      video_source:
        description: 'Direct Video URL or Repository File Path (e.g. videos/sample.mp4)'
        required: true
        default: 'videos/input.mp4'

jobs:
  process-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Input Video
        run: python scripts/01_fetch_video.py --input "${{ github.event.inputs.video_source }}"

      - name: Transcribe Video
        run: python scripts/02_transcribe.py

      - name: Translate Script
        run: python scripts/03_translate_script.py

      - name: Dub Audio
        run: python scripts/04_tts_dub_audio.py

      - name: Merge Video
        run: python scripts/05_merge_video.py

      - name: Upload Output Video
        run: python scripts/06_upload_github.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
